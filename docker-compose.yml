services:
  postgres:
    container_name: postgres-sql-wac
    image: postgres:latest
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: Whatsappclone42&#24postgresql
      POSTGRES_DB: whatsapp_clone
#      PGDATA: /var/lib/postgresql
    volumes:
      - postgres_wac:/data/postgres
    ports:
      - "9000:5432"
    networks:
      - whatsapp-clone
    restart: unless-stopped

  keycloak:
    container_name: keycloak-wac
    image: quay.io/keycloak/keycloak:26.5.2
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: Whatsappclone42&#24keycloak
    volumes:
      - keycloak_wac:/opt/keycloak/data
    ports:
      - "9090:8080"
    networks:
      - whatsapp-clone
    command:
      - "start-dev"

networks:
  whatsapp-clone:
    driver: bridge

volumes:
  postgres_wac:
    driver: local
  keycloak_wac:
    driver: local
